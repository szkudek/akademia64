name: Import 100k Lichess puzzles
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-puzzles.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check requests zstandard python-chess
      - name: Import and validate 100,000 Lichess puzzles
        run: python scripts/import_lichess_puzzles.py
      - name: Verify output count and sizes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('dist/puzzle-index.json').read_text())
          assert p['count']==100_000
          assert sum(x['count'] for x in p['shards'])==100_000
          assert len(list(Path('dist/puzzles').glob('*.json')))==len(p['shards'])
          print("100,000 verified puzzles in",len(p['shards']),"shards")
          PY
      - name: Commit published puzzle shards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/puzzle-index.json dist/puzzles/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish 100,000 Lichess CC0 puzzles as rating shards"
          git push origin HEAD:main
