name: Import 1 million Lichess puzzles
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-puzzles.yml"
permissions:
  contents: write
concurrency:
  group: lichess-puzzle-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check requests zstandard python-chess
      - name: Import and validate one million Lichess puzzles
        run: python scripts/import_lichess_puzzles.py
      - name: Commit published puzzle shards and lookup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/puzzle-index.json dist/puzzles/ dist/puzzle-lookup/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish one million verified Lichess puzzles"
          git pull --rebase origin main
          git push origin HEAD:main
