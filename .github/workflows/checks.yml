name: Check application and accounts
on:
  pull_request:
  push:
    branches: [main, feature/accounts]
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - run: npm run sync:entry && git diff --exit-code -- index.html
